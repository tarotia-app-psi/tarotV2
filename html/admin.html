
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TarotIA - Panel de Administración</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { color: #c084fc; border-bottom: 2px solid #334155; padding-bottom: 10px; }
        .grid { display: grid; grid-template-columns: 1fr 2fr; gap: 20px; margin-top: 20px; }
        .card { background: #1e293b; border: 1px solid #334155; padding: 20px; border-radius: 12px; }
        h2 { color: #38bdf8; margin-top: 0; }
        .btn { border: none; padding: 12px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; width: 100%; margin-bottom: 15px; font-size: 14px; text-transform: uppercase; transition: all 0.2s ease; }
        .btn-status { background: #475569; color: white; }
        .btn-link { background: #6366f1; color: white; text-decoration: none; display: block; text-align: center; border-radius: 6px; padding: 12px 15px; font-weight: bold; font-size: 14px; }
        .btn-link:hover { background: #4f46e5; }
        .active-premium { background: #22c55e !important; color: #052e16 !important; box-shadow: 0 0 15px rgba(34, 197, 94, 0.3); }
        .active-gratis { background: #eab308 !important; color: #451a03 !important; box-shadow: 0 0 15px rgba(234, 179, 8, 0.3); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; background: #111827; border-radius: 8px; overflow: hidden; }
        th, td { text-align: left; padding: 14px; border-bottom: 1px solid #334155; }
        th { background: #0f172a; color: #94a3b8; font-size: 12px; text-transform: uppercase; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-premium { background: #22c55e; color: #052e16; }
        .badge-gratis { background: #64748b; color: #f8fafc; }
        .txt-ayuda { font-size: 13px; color: #94a3b8; line-height: 1.5; }
        .btn-act-premium { background: #22c55e; color: #052e16; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-act-premium:hover { background: #16a34a; color: white; }
        .btn-act-quitar { background: #ef4444; color: white; border: none; padding: 6px 12px; border-radius: 4px; font-weight: bold; cursor: pointer; }
        .btn-act-quitar:hover { background: #dc2626; }
        .error-box { background: #7f1d1d; border: 1px solid #f87171; padding: 15px; border-radius: 8px; color: #fca5a5; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔮 Panel de Control General - TarotIA</h1>
    
    <div class="grid">
        <div class="card">
            <h2>⚙️ Simulador de Modos</h2>
            <p class="txt-ayuda">Alterná el estado del sistema para probar la app:</p>
            <button id="btn-toggle-premium" class="btn btn-status">Cargando estado...</button>
            
            <hr style="border-color: #334155; margin: 20px 0;">
            
            <h2>🛠️ Pruebas de Sistema</h2>
            <a href="index.html" target="_blank" class="btn-link">Abrir App de Clientes ↗</a>
        </div>

        <div class="card">
            <h2>👥 Listado de Clientes y Consumos</h2>
            <p class="txt-ayuda">Historial real de usuarios registrados:</p>
            <div id="tabla-clientes-contenedor"></div>
        </div>
    </div>
</div>

<script>
    // ⚠️ EN PRODUCCIÓN: Esto debería venir de variables de entorno
    const CLAVE_ACCESO = atob("TWFyaW5hUmFiaW5vMTk5NQ=="); // Base64 básico
    const TOKEN_BACKEND = CLAVE_ACCESO;

    (function() {
        const intento = prompt("Acceso Restringido. Introduce la clave de administrador:");
        if (intento !== CLAVE_ACCESO) {
            alert("Acceso denegado.");
            window.location.href = "index.html";
        }
    })();

    const API_URL = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
        ? 'http://localhost:3000' 
        : 'https://tarotia-backend.onrender.com';

    document.addEventListener("DOMContentLoaded", () => {
        actualizarBotonEstado();
        cargarListaClientes();
    });

    function actualizarBotonEstado() {
        const btn = document.getElementById('btn-toggle-premium');
        let esPremium = localStorage.getItem('simularPremium') === 'true';
        btn.innerText = esPremium ? "SISTEMA: VISTA PREMIUM ACTIVA ✨" : "SISTEMA: VISTA GRATIS ACTIVA 🃏";
        btn.className = esPremium ? "btn active-premium" : "btn active-gratis";
    }

    document.getElementById('btn-toggle-premium').addEventListener('click', () => {
        let esPremium = localStorage.getItem('simularPremium') === 'true';
        localStorage.setItem('simularPremium', !esPremium);
        actualizarBotonEstado();
    });

    async function cargarListaClientes() {
        const contenedor = document.getElementById('tabla-clientes-contenedor');
        contenedor.innerHTML = "<p style='color: #94a3b8; font-size: 14px;'>Consultando registros...</p>";

        try {
            const response = await fetch(`${API_URL}/api/admin/clientes`, {
                headers: { 'x-admin-token': TOKEN_BACKEND }
            });

            if (!response.ok) throw new Error(`Error ${response.status}`);

            const data = await response.json();
            const clientes = data.clientes || [];

            if (clientes.length === 0) {
                contenedor.innerHTML = "<p style='color: #ef4444;'>No se encontraron clientes.</p>";
                return;
            }

            let html = `<table><thead><tr><th>Cliente</th><th>Email</th><th>Plan</th><th>Tiradas</th><th>Última Actividad</th><th>Acción</th></tr></thead><tbody>`;
            
            clientes.forEach(c => {
                const esPremium = c.plan === 'Premium';
                const badgeClass = esPremium ? 'badge-premium' : 'badge-gratis';
                const idCliente = c.id || c.email;
                const btn = esPremium 
                    ? `<button class="btn-act-quitar" onclick="cambiarPlan('${idCliente}', 'Gratis')">Quitar Premium</button>`
                    : `<button class="btn-act-premium" onclick="cambiarPlan('${idCliente}', 'Premium')">Hacer Premium</button>`;

                html += `<tr><td><strong>${c.nombre}</strong></td><td>${c.email}</td><td><span class="badge ${badgeClass}">${c.plan}</span></td><td>🔮 ${c.totalTiradas}</td><td>${c.ultimaConexion}</td><td>${btn}</td></tr>`;
            });
            
            html += `</tbody></table>`;
            contenedor.innerHTML = html;

        } catch (error) {
            contenedor.innerHTML = `<div class="error-box"><strong>Error:</strong> ${error.message}</div>`;
        }
    }

    async function cambiarPlan(userId, nuevoPlan) {
        if (!confirm(`¿Cambiar plan a ${nuevoPlan}?`)) return;
        try {
            const response = await fetch(`${API_URL}/api/admin/cambiar-plan`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-admin-token': TOKEN_BACKEND },
                body: JSON.stringify({ userId, nuevoPlan })
            });
            if (response.ok) {
                cargarListaClientes();
            } else {
                alert("Error al modificar el plan.");
            }
        } catch (error) {
            alert("No se pudo conectar con el servidor.");
        }
    }
</script>
</body>
</html>
